# Served over local HTTP by run_evals.py to exercise the spec-as-URL path.
# Expected findings: info-version-missing, servers-missing (and nothing else).
openapi: 3.0.0
info:
  title: Remote Widget API
paths:
  /v1/widgets:
    get:
      operationId: listWidgets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
        '429':
          description: Rate limit exceeded
        '500':
          description: Internal server error
      security:
        - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
